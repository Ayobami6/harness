name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOOSE_VERSION: v3.29.0
  SQLC_VERSION: v1.31.1
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod and go.sum tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

  test:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run race-enabled tests with coverage
        run: |
          go test -race -v -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out

      - name: Write coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          {
            echo "### 🧪 Go Test Coverage Summary"
            echo '```text'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14

  database:
    name: Migrations & sqlc Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Goose & sqlc
        run: |
          make goose-install
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@${{ env.SQLC_VERSION }}

      - name: Verify migrations (up, down, re-up)
        run: |
          TEST_DB="/tmp/ci-harness.db"
          make migrate-up DB_PATH="$TEST_DB"
          make migrate-status DB_PATH="$TEST_DB"
          make migrate-down DB_PATH="$TEST_DB"
          make migrate-up DB_PATH="$TEST_DB"

      - name: Validate sqlc queries & generated code
        run: |
          sqlc compile
          make generate
          go build ./internal/repository/...
          if [ -n "$(git status --porcelain --untracked-files=no internal/repository)" ]; then
            echo "::error::internal/repository is out of sync with db/migrations and db/queries. Run 'make generate' and commit the changes."
            git diff internal/repository
            exit 1
          fi

  build:
    name: Build Cross-Platform Binaries & Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build static binaries across targets
        run: |
          mkdir -p dist
          targets=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )
          for target in "${targets[@]}"; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            ext=""
            if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
            out="dist/harness-${GOOS}-${GOARCH}${ext}"
            echo "Building ${out}..."
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/main.go
          done
          ls -lh dist/

      - name: Upload built binaries
        uses: actions/upload-artifact@v4
        with:
          name: harness-binaries
          path: dist/
          retention-days: 7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: harness:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Goose migration inside container
        run: |
          docker run --rm harness:ci goose -dir /app/db/migrations sqlite3 /tmp/container-test.db up
          docker run --rm harness:ci goose -dir /app/db/migrations sqlite3 /tmp/container-test.db status

  security:
    name: Vulnerability Check (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

