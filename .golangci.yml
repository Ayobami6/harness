version: "2"
run:
  timeout: 5m
  build-tags: [integration]
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - sqlclosecheck
    - unconvert
  settings:
    gosec:
      excludes:
        - G115 # integer conversions are bounded by validation
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      # Tests build requests and read fixtures directly; context plumbing and
      # cookie flags there aren't production paths.
      - path: _test\.go
        linters: [gosec, noctx, errcheck]
formatters:
  enable: [gofmt]